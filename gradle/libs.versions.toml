[versions]
agp = "9.4.0"
kotlin = "2.3.21"
ksp = "2.3.12"
hilt = "2.60.1"
androidxHilt = "1.4.0"
coreKtx = "1.19.1"
activity = "1.13.0"
lifecycle = "2.11.0"
navigation = "2.10.2"
